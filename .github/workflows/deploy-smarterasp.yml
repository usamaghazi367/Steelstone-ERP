# Push to main → build Vue + .NET → FTP upload to SmarterASP (site files only).
# Server appsettings.Production.json is NOT overwritten (see exclude list).

name: Deploy to SmarterASP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sync_runtimes:
        description: Upload runtimes/ (only if .NET native deps changed)
        type: boolean
        default: false

concurrency:
  group: smarterasp-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ConstFire.Frontend/package-lock.json

      - name: Build frontend
        working-directory: ConstFire.Frontend
        run: |
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish backend
        run: dotnet publish ConstFire.Backend/ConstFire.Backend.csproj -c Release -o "${{ github.workspace }}/publish"

      - name: Assemble wwwroot and logs
        run: |
          rm -rf publish/wwwroot
          cp -r ConstFire.Frontend/dist publish/wwwroot
          mkdir -p publish/logs
          rm -f publish/appsettings.Production.json publish/appsettings.Production.local.json || true
          find publish -name '*.pdb' -delete || true
          echo "{}" > publish/.ftp-deploy-sync-state.json

      - name: Install LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      # lftp FTPS is more reliable than rclone on SmarterASP from GitHub runners.
      - name: Deploy via FTPS (lftp)
        env:
          FTP_SERVER: ${{ secrets.SMARTERASP_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.SMARTERASP_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.SMARTERASP_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.SMARTERASP_FTP_REMOTE_DIR }}
          SYNC_RUNTIMES: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_runtimes || false }}
        run: |
          set -euo pipefail
          REMOTE="${FTP_REMOTE_DIR:-/}"
          REMOTE="${REMOTE%/}"
          if [ -z "$REMOTE" ]; then REMOTE="/"; fi
          du -sh publish || true
          du -sh publish/wwwroot publish/Data publish/LatoFont publish/runtimes 2>/dev/null || true

          LFTP_BASE="
            set net:timeout 180;
            set net:max-retries 8;
            set net:reconnect-interval-base 8;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set sync:use-mdtm false;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ftps://${FTP_SERVER};
            lcd publish;
            cd ${REMOTE};
          "

          run_lftp() {
            local label="$1"
            local body="$2"
            for attempt in 1 2 3; do
              echo "=== ${label} (attempt ${attempt}/3) ==="
              if lftp -c "${LFTP_BASE} ${body} bye"; then
                return 0
              fi
              echo "${label} failed; waiting 45s..."
              sleep 45
            done
            return 1
          }

          run_lftp "wwwroot" "echo 'Upload wwwroot'; mirror -R -v --parallel=2 --delete wwwroot;" || exit 1
          run_lftp "root binaries" "echo 'Upload publish root DLLs/config (no subdirs)'; mirror -R -v --parallel=1 --ignore-time --no-recursion \
            --exclude-glob appsettings.Production.json \
            --exclude-glob appsettings.Production.local.json \
            --exclude-glob appsettings.Development.json \
            --exclude-glob '*.pdb' .;" || exit 1
          run_lftp "Data" "echo 'Upload Data/'; mirror -R -v --parallel=1 --ignore-time Data;" || exit 1
          run_lftp "LatoFont" "echo 'Upload LatoFont/'; mirror -R -v --parallel=1 --ignore-time LatoFont;" || exit 1

          if [ "${SYNC_RUNTIMES}" = "true" ]; then
            run_lftp "runtimes" "echo 'Upload runtimes/ (manual)'; mirror -R -v --parallel=1 --ignore-time runtimes;" || exit 1
          else
            echo "Skipping runtimes/ (~138MB; already on server — use workflow_dispatch sync_runtimes if needed)."
          fi

          echo "SmarterASP FTPS deploy completed."
