# Push to main → build Vue + .NET → FTP upload to SmarterASP (site files only).
# Server appsettings.Production.json is NOT overwritten (see exclude list).

name: Deploy to SmarterASP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smarterasp-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ConstFire.Frontend/package-lock.json

      - name: Build frontend
        working-directory: ConstFire.Frontend
        run: |
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish backend
        run: dotnet publish ConstFire.Backend/ConstFire.Backend.csproj -c Release -o "${{ github.workspace }}/publish"

      - name: Assemble wwwroot and logs
        run: |
          rm -rf publish/wwwroot
          cp -r ConstFire.Frontend/dist publish/wwwroot
          mkdir -p publish/logs
          rm -f publish/appsettings.Production.json publish/appsettings.Production.local.json || true
          find publish -name '*.pdb' -delete || true

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Deploy via FTPS (rclone)
        env:
          FTP_SERVER: ${{ secrets.SMARTERASP_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.SMARTERASP_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.SMARTERASP_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.SMARTERASP_FTP_REMOTE_DIR }}
        run: |
          REMOTE="${FTP_REMOTE_DIR:-/}"
          REMOTE="${REMOTE#/}"
          REMOTE="${REMOTE%/}"
          export RCLONE_CONFIG_ASP_TYPE=ftp
          export RCLONE_CONFIG_ASP_HOST="${FTP_SERVER}"
          export RCLONE_CONFIG_ASP_PORT=21
          export RCLONE_CONFIG_ASP_USER="${FTP_USERNAME}"
          export RCLONE_CONFIG_ASP_PASS="$(rclone obscure "${FTP_PASSWORD}")"
          export RCLONE_CONFIG_ASP_EXPLICIT_TLS=true
          export RCLONE_CONFIG_ASP_NO_CHECK_CERTIFICATE=true
          DEST="asp:"
          if [ -n "$REMOTE" ]; then DEST="asp:${REMOTE}"; fi
          rclone lsd "$DEST" --contimeout 60s --timeout 60s
          rclone copy publish "$DEST" \
            --transfers 2 \
            --retries 8 \
            --low-level-retries 20 \
            --contimeout 90s \
            --timeout 600s \
            -v \
            --exclude "appsettings.Production.json" \
            --exclude "appsettings.Production.local.json" \
            --exclude "appsettings.Development.json" \
            --exclude ".git/**"
